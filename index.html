<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="앱별 개인정보처리방침 모음">
  <title>Privacy Policies</title>
  <style>
    :root { color-scheme: light; --ink:#29251f; --muted:#746d63; --paper:#fffdf8; --card:#fff; --line:#e9e1d5; --accent:#a85f3d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(180deg,#f6eee4,var(--paper) 28rem); font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
    .wrap { width:min(860px,calc(100% - 32px)); margin:0 auto; }
    header { padding:72px 0 32px; }
    .eyebrow { color:var(--accent); font-size:.8rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:14px 0 10px; font-size:clamp(2.2rem,6vw,4rem); line-height:1.1; letter-spacing:-.04em; }
    .lead { max-width:650px; color:var(--muted); }
    main { padding-bottom:72px; }
    .card { display:block; padding:28px; border:1px solid var(--line); border-radius:20px; color:inherit; background:rgba(255,255,255,.9); box-shadow:0 18px 50px rgba(66,45,27,.1); text-decoration:none; }
    .card:hover { border-color:#d7b39c; transform:translateY(-2px); transition:.18s ease; }
    .card h2 { margin:0 0 6px; color:var(--accent); font-size:1.45rem; }
    .card p { margin:0; color:var(--muted); }
    .path { display:inline-block; margin-top:16px; color:var(--accent); font-size:.9rem; font-weight:700; }
    footer { padding-bottom:48px; color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="eyebrow">Privacy Policies</div>
    <h1>앱별 개인정보처리방침</h1>
    <p class="lead">앱별 폴더를 사용해 개인정보처리방침을 관리합니다. 아래에서 앱을 선택하세요.</p>
  </header>
  <main class="wrap">
    <a class="card" href="./japan-story/">
      <h2>Japan Story</h2>
      <p>일본어 학습 Android 앱의 개인정보처리방침 · 패키지명 <code>com.scott.studioja</code></p>
      <span class="path">/japan-story/ → 정책 보기</span>
    </a>
  </main>
  <footer class="wrap">정책 저장소 · 앱별 정책은 각 폴더에서 관리됩니다.</footer>
</body>
</html>
